<svg xmlns="http://www.w3.org/2000/svg" width="1131" height="374" viewBox="0 0 1131 374" role="img" aria-labelledby="title desc">
  <title id="title">连接 OpenAI 兼容模型服务</title><desc id="desc">填写你自己的服务配置；图中顺序适用于首次接入。 测试失败：检查地址、密钥、权限和模型，再重试。自动整理默认关闭。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3c6dc3"/></marker></defs>
  <rect width="1131" height="374" rx="20" fill="#fff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Arial,sans-serif">
  <rect x="32" y="28" width="5" height="34" rx="2.5" fill="#3c6dc3"/>
  <text x="52" y="57" font-size="30" fill="#243651" font-weight="650">连接 OpenAI 兼容模型服务</text>
  <text x="32" y="91" font-size="19" fill="#667a95" font-weight="400">填写你自己的服务配置；图中顺序适用于首次接入。</text><rect x="32" y="124" width="248" height="166" rx="16" fill="#eef3fd"/>
      <rect x="50" y="140" width="30" height="30" rx="9" fill="#3c6dc3"/>
      <text x="60" y="162" font-size="20" fill="white" font-weight="600">1</text>
      <text x="50" y="207" font-size="25" fill="#243651" font-weight="600">填写接口配置</text>
      <text x="50" y="242" font-size="18" fill="#667a95" font-weight="400">Base URL 与 API Key</text>
      <text x="50" y="270" font-size="18" fill="#667a95" font-weight="400">密钥按服务要求填写</text>
      <path d="M280 206 H304" stroke="#3c6dc3" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="305" y="124" width="248" height="166" rx="16" fill="#eef3fd"/>
      <rect x="323" y="140" width="30" height="30" rx="9" fill="#3c6dc3"/>
      <text x="333" y="162" font-size="20" fill="white" font-weight="600">2</text>
      <text x="323" y="207" font-size="25" fill="#243651" font-weight="600">授权远程主机</text>
      <text x="323" y="242" font-size="18" fill="#667a95" font-weight="400">远程 HTTPS：点击授权</text>
      <text x="323" y="270" font-size="18" fill="#667a95" font-weight="400">本机 HTTP：无需此步</text>
      <path d="M553 206 H577" stroke="#3c6dc3" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="578" y="124" width="248" height="166" rx="16" fill="#eef3fd"/>
      <rect x="596" y="140" width="30" height="30" rx="9" fill="#3c6dc3"/>
      <text x="606" y="162" font-size="20" fill="white" font-weight="600">3</text>
      <text x="596" y="207" font-size="25" fill="#243651" font-weight="600">选择或填写模型</text>
      <text x="596" y="242" font-size="18" fill="#667a95" font-weight="400">刷新列表，或手填模型 ID</text>
      <text x="596" y="270" font-size="18" fill="#667a95" font-weight="400">列表可见不等于可调用</text>
      <path d="M826 206 H850" stroke="#3c6dc3" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="851" y="124" width="248" height="166" rx="16" fill="#e5f5ef"/>
      <rect x="869" y="140" width="30" height="30" rx="9" fill="#138978"/>
      <text x="879" y="162" font-size="20" fill="white" font-weight="600">4</text>
      <text x="869" y="207" font-size="25" fill="#243651" font-weight="600">测试连接</text>
      <text x="869" y="242" font-size="18" fill="#667a95" font-weight="400">仅发送一条简短测试消息</text>
      <text x="869" y="270" font-size="18" fill="#667a95" font-weight="400">成功后用公开页面试分组</text>

  <text x="32" y="338" font-size="21" fill="#667a95" font-weight="400">测试失败：检查地址、密钥、权限和模型，再重试。自动整理默认关闭。</text>
  </g></svg>
